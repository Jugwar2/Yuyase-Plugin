<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yuyase — Configure</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh}
.header{background:#161b22;border-bottom:1px solid #30363d;padding:20px 24px;display:flex;align-items:center;gap:16px}
.header h1{font-size:20px;font-weight:600;color:#e6edf3}
.header .badge{font-size:12px;padding:2px 8px;border-radius:12px;background:#238636;color:#fff}
.header .desc{color:#8b949e;font-size:13px}
.container{max-width:720px;margin:0 auto;padding:24px 24px 100px}
.section{margin-bottom:28px}
.section-title{font-size:13px;font-weight:600;color:#8b949e;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #21262d}
.form-group{margin-bottom:10px;display:flex;align-items:center;gap:12px;min-height:36px}
.form-group>label:first-child{flex:0 0 180px;font-size:13px;color:#c9d1d9;font-weight:500;white-space:nowrap}
.form-group .hint{font-size:11px;color:#8b949e}
.pill-row{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.pill{font-size:12px;padding:4px 12px;border-radius:16px;border:1px solid #30363d;background:transparent;color:#c9d1d9;cursor:pointer;transition:all .15s;user-select:none}
.pill:hover{border-color:#58a6ff;background:#1f2937}
.pill.active{background:#1f6feb;border-color:#1f6feb;color:#fff}
input[type=text],input[type=number]{background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:6px 12px;color:#c9d1d9;font-size:13px;flex:1;outline:none;transition:border-color .15s}
input[type=text]:focus,input[type=number]:focus{border-color:#58a6ff}
input[type=text]::placeholder{color:#484f58}
.toggle-wrapper{position:relative;display:inline-block;width:40px;height:22px;flex-shrink:0}
.toggle-wrapper input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#30363d;border-radius:22px;transition:.2s}
.toggle-slider:before{content:'';position:absolute;height:16px;width:16px;left:3px;bottom:3px;background:#c9d1d9;border-radius:50%;transition:.2s}
input:checked+.toggle-slider{background:#1f6feb}
input:checked+.toggle-slider:before{transform:translateX(18px)}
.footer{position:fixed;bottom:0;left:0;right:0;background:#161b22;border-top:2px solid #30363d;padding:16px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;z-index:10}
.install-url{flex:1;min-width:0;font-family:'SF Mono',Consolas,monospace;font-size:12px;padding:10px 14px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#7ee787;word-break:break-all;user-select:all}
.btn{font-size:13px;font-weight:600;padding:8px 20px;border-radius:6px;border:none;cursor:pointer;white-space:nowrap;transition:background .15s}
.btn-primary{background:#238636;color:#fff}
.btn-primary:hover{background:#2ea043}
.btn-secondary{background:#21262d;color:#c9d1d9;border:1px solid #30363d}
.btn-secondary:hover{background:#30363d}
.copied{color:#7ee787;font-size:12px;display:none;margin-left:8px}
.copied.visible{display:inline}
.sources-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.source-tab{font-size:12px;padding:4px 14px;border-radius:6px;border:1px solid #30363d;color:#8b949e;cursor:pointer;transition:all .15s}
.source-tab:hover{border-color:#58a6ff;color:#c9d1d9}
.source-tab.active{background:#1f6feb;border-color:#1f6feb;color:#fff}
</style>
</head>
<body>
<div class="header">
  <h1>Yuyase</h1>
  <span class="badge">v1.3.0</span>
  <span class="desc">Torrent extension pack for Hayase</span>
</div>

<div class="container">
  <div class="section">
    <div class="section-title">Source</div>
    <div class="sources-grid" id="sourceTabs"></div>
  </div>

  <div class="section">
    <div class="section-title">Resolution &amp; Quality</div>
    <div class="form-group">
      <label>Preferred Resolution</label>
      <div class="pill-row" id="pills-resolution"></div>
    </div>
    <div class="form-group">
      <label>Preferred Source</label>
      <div class="pill-row" id="pills-source"></div>
    </div>
    <div class="form-group">
      <label>Preferred Codec</label>
      <div class="pill-row" id="pills-codec"></div>
    </div>
    <div class="form-group">
      <label>Max Results <span class="hint">(0 = unlimited)</span></label>
      <input type="number" id="inp-maxResults" placeholder="0" min="0" max="50">
    </div>
    <div class="form-group">
      <label>Max File Size (MB) <span class="hint">(0 = no limit)</span></label>
      <input type="number" id="inp-maxFileSizeMB" placeholder="0" min="0">
    </div>
  </div>

  <div class="section">
    <div class="section-title">Language &amp; Audio</div>
    <div class="form-group">
      <label>Preferred Audio</label>
      <div class="pill-row" id="pills-audio"></div>
    </div>
    <div class="form-group">
      <label>Preferred Subtitles</label>
      <div class="pill-row" id="pills-subtitles"></div>
    </div>
    <div class="form-group">
      <label>Prefer Dual Audio</label>
      <label class="toggle-wrapper">
        <input type="checkbox" id="chk-preferDualAudio"><span class="toggle-slider"></span>
      </label>
    </div>
    <div class="form-group">
      <label>Prefer English Dubs</label>
      <label class="toggle-wrapper">
        <input type="checkbox" id="chk-preferDub"><span class="toggle-slider"></span>
      </label>
    </div>
    <div class="form-group">
      <label>Allow raw (no subs)</label>
      <label class="toggle-wrapper">
        <input type="checkbox" id="chk-allowRaw" checked><span class="toggle-slider"></span>
      </label>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Batch &amp; Groups</div>
    <div class="form-group">
      <label>Prefer batches</label>
      <label class="toggle-wrapper">
        <input type="checkbox" id="chk-preferBatch"><span class="toggle-slider"></span>
      </label>
    </div>
    <div class="form-group">
      <label>Fallback to batch</label>
      <label class="toggle-wrapper">
        <input type="checkbox" id="chk-fallbackToBatch" checked><span class="toggle-slider"></span>
      </label>
    </div>
    <div class="form-group">
      <label>Preferred Groups</label>
      <input type="text" id="inp-preferredGroups" placeholder="SubsPlease, Erai-raws, Judas">
    </div>
    <div class="form-group">
      <label>Avoid Groups</label>
      <input type="text" id="inp-avoidGroups" placeholder="SSA, Mini">
    </div>
    <div class="form-group">
      <label>Exclude keywords</label>
      <input type="text" id="inp-exclusions" placeholder="pulp, bad">
    </div>
  </div>
</div>

<div class="footer">
  <input class="install-url" id="installUrl" readonly value="" onclick="this.select()" spellcheck="false">
  <button class="btn btn-primary" onclick="copy()">Copy</button>
  <span class="copied" id="copiedMsg">Copied!</span>
  <button class="btn btn-secondary" onclick="resetAll()">Reset</button>
</div>

<script>
(function(){
  'use strict';

  var SOURCES = [
    { id:'yuyase.nyaa',       name:'Nyaa',          code:'nyaa.js' },
    { id:'yuyase.animetosho', name:'AnimeTosho',    code:'animetosho.js' },
    { id:'yuyase.seadex',     name:'Seadex',        code:'seadex.js' },
    { id:'yuyase.subsplease', name:'SubsPlease',    code:'subsplease.js' },
    { id:'yuyase.yameii',     name:'Yameii (Dubs)', code:'yameii.js' },
    { id:'yuyase.toonshub',   name:'ToonsHub',      code:'toonshub.js' }
  ];

  var CDN = 'https://raw.githubusercontent.com/Jugwar2/Yuyase-Plugin/master';

  var DEFAULTS = {
    preferredResolution: [], preferredCodec: [], preferredGroups: [], avoidGroups: [],
    preferredAudio: [], preferredSubtitles: [],
    preferDualAudio: false, preferDub: false, allowRaw: true,
    preferBatch: false, fallbackToBatch: true,
    preferredSource: [], maxResults: 0, exclusions: [], maxFileSizeMB: 0
  };

  var PILLS = {
    resolution: { key:'preferredResolution', vals:['2160','1080','720','480'] },
    source:     { key:'preferredSource',     vals:['bd','remux','web-dl','web','bluray','hdtv'] },
    codec:      { key:'preferredCodec',      vals:['hevc','av1','vp9','avc','x264','x265'] },
    audio:      { key:'preferredAudio',      vals:['ja','en','pt-BR','es-419','fr','de','it','ru','ko','zh','ar'] },
    subtitles:  { key:'preferredSubtitles',  vals:['en','es','pt-BR','fr','de','it','ru','ar','ja','ko','zh'] }
  };

  var BOOLS   = ['preferDualAudio','preferDub','allowRaw','preferBatch','fallbackToBatch'];
  var TEXTS   = ['preferredGroups','avoidGroups','exclusions'];
  var NUMS    = ['maxResults','maxFileSizeMB'];

  var activeSource = 0;

  function splitCSV(s) { return (s||'').split(',').map(function(x){return x.trim();}).filter(Boolean); }

  // Build pill groups
  Object.keys(PILLS).forEach(function(ok) {
    var group = PILLS[ok];
    var el = document.getElementById('pills-'+ok);
    if (!el) return;
    group.vals.forEach(function(v) {
      var p = document.createElement('span');
      p.className = 'pill';
      p.textContent = v;
      p.addEventListener('click', function(ev) {
        ev.currentTarget.classList.toggle('active');
        regenerate();
      });
      el.appendChild(p);
    });
  });

  // Build source tabs
  (function() {
    var el = document.getElementById('sourceTabs');
    SOURCES.forEach(function(s, i) {
      var t = document.createElement('span');
      t.className = 'source-tab' + (i===0?' active':'');
      t.textContent = s.name;
      t.addEventListener('click', function(ev) {
        document.querySelectorAll('.source-tab').forEach(function(x){x.classList.remove('active');});
        ev.currentTarget.classList.add('active');
        activeSource = i;
        regenerate();
      });
      el.appendChild(t);
    });
  })();

  // Bind all inputs
  BOOLS.forEach(function(k){
    var el = document.getElementById('chk-'+k);
    if (el) el.addEventListener('change', regenerate);
  });
  TEXTS.forEach(function(k){
    var el = document.getElementById('inp-'+k);
    if (el) el.addEventListener('input', regenerate);
  });
  NUMS.forEach(function(k){
    var el = document.getElementById('inp-'+k);
    if (el) el.addEventListener('input', regenerate);
  });

  // Collect current config from UI
  function collectConfig() {
    var cfg = {};
    Object.keys(DEFAULTS).forEach(function(k){ cfg[k] = deepClone(DEFAULTS[k]); });

    // Pill values
    Object.keys(PILLS).forEach(function(ok) {
      var grp = PILLS[ok];
      cfg[grp.key] = [];
      var pills = document.querySelectorAll('#pills-'+ok+' .pill.active');
      for (var i=0; i<pills.length; i++) {
        cfg[grp.key].push(pills[i].textContent.toLowerCase());
      }
    });

    // Booleans
    BOOLS.forEach(function(k){
      var el = document.getElementById('chk-'+k);
      if (el) cfg[k] = el.checked;
    });

    // Text
    TEXTS.forEach(function(k){
      var el = document.getElementById('inp-'+k);
      if (el) cfg[k] = splitCSV(el.value);
    });

    // Numbers
    NUMS.forEach(function(k){
      var el = document.getElementById('inp-'+k);
      if (el) cfg[k] = parseInt(el.value,10) || 0;
    });

    return cfg;
  }

  function deepClone(x) {
    if (Array.isArray(x)) return x.slice();
    if (x && typeof x === 'object') {
      var o = {};
      Object.keys(x).forEach(function(k){ o[k] = deepClone(x[k]); });
      return o;
    }
    return x;
  }

  function regenerate() {
    var cfg = collectConfig();
    var json = JSON.stringify(cfg);
    var b64 = btoa(json);
    var src = SOURCES[activeSource];
    document.getElementById('installUrl').value = CDN + '/dist/' + src.code + '?c=' + b64;
    var msg = document.getElementById('copiedMsg');
    msg.classList.remove('visible');
  }

  function copy() {
    var input = document.getElementById('installUrl');
    navigator.clipboard.writeText(input.value).then(function(){
      var msg = document.getElementById('copiedMsg');
      msg.classList.add('visible');
      setTimeout(function(){ msg.classList.remove('visible'); }, 2000);
    });
  }

  function resetAll() {
    document.querySelectorAll('.pill').forEach(function(p){ p.classList.remove('active'); });
    BOOLS.forEach(function(k){
      var el = document.getElementById('chk-'+k);
      if (el) el.checked = DEFAULTS[k];
    });
    TEXTS.forEach(function(k){
      var el = document.getElementById('inp-'+k);
      if (el) el.value = '';
    });
    NUMS.forEach(function(k){
      var el = document.getElementById('inp-'+k);
      if (el) el.value = '';
    });
    regenerate();
  }

  regenerate();
})();
</script>
</body>
</html>
